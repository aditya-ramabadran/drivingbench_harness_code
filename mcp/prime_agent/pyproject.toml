[project]
name = "prime-agent-skill-drivingbench-sandbox"
version = "0.1.0"
description = "The drivingbench_sandbox tools as Python functions for Prime Agent, with camera images attached."
requires-python = ">=3.11,<3.13"
dependencies = ["opencv-python-headless>=4.10", "pillow>=10.0.0", "prime-agent-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drivingbench_sandbox"]
